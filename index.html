<!doctype html>
<html lang="uz" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#fabd00" />
    <meta name="description" content="Sariq Bola Pizza moliyaviy boshqaruv tizimi" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SB Finance" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>Sariq Bola Finance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        // Auto-reload when a new SW takes over (clears stale cache on phone/tablet)
        navigator.serviceWorker.addEventListener('message', e => {
          if (e.data && e.data.type === 'SW_UPDATED') {
            window.location.reload()
          }
        })
        // Also reload on controllerchange (new SW claimed this page)
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          window.location.reload()
        })

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sariq-bola-finance/sw.js', {
            scope: '/sariq-bola-finance/'
          }).catch(() => {})
        })
      }
    </script>
  </body>
</html>
